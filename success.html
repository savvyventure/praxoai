<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - PraxoAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0f; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gradient-text {
            background: linear-gradient(135deg, #a78bfa 0%, #22d3ee 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass rounded-3xl p-8 md:p-12 max-w-md w-full text-center">
        <div class="w-20 h-20 rounded-full bg-green-500/20 flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="font-display font-bold text-3xl text-white mb-4">Payment Successful!</h1>
        <p class="text-gray-400 mb-6">Thank you for your purchase. Your productivity tool has been sent to your email.</p>

        <div class="bg-white/5 rounded-xl p-4 mb-6 text-left">
            <div class="flex justify-between mb-2">
                <span class="text-gray-400">Order ID</span>
                <span id="orderId" class="text-white font-mono">Loading...</span>
            </div>
            <div class="flex justify-between mb-2">
                <span class="text-gray-400">Status</span>
                <span class="text-green-400">Confirmed</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-400">Delivery</span>
                <span class="text-white">Email</span>
            </div>
        </div>

        <a href="/" class="block w-full bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white py-3 rounded-xl font-semibold transition-all">
            Back to Store
        </a>
    </div>

    <script>
        // Extract payment intent from URL
        const urlParams = new URLSearchParams(window.location.search);
        const paymentIntent = urlParams.get('payment_intent');
        if (paymentIntent) {
            document.getElementById('orderId').textContent = paymentIntent.slice(-8).toUpperCase();
        }
    </script>
</body>
</html>
